name: Build Windows EXE

on:
  push:
    paths:
      - 'pms_sync.py'
      - 'pms_sync.spec'
      - '.github/workflows/build.yml'
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller certifi

      - name: Build EXE
        run: pyinstaller pms_sync.spec --clean --noconfirm --log-level WARN

      - name: Create release package
        shell: cmd
        run: |
          mkdir release_pms_sync
          copy dist\pms_sync.exe release_pms_sync\
          (
            echo PMS同步工具 - 使用说明
            echo ======================
            echo.
            echo 一、环境要求
            echo   - Windows 7/10/11 (64位^)
            echo   - 必须安装 dws CLI 工具
            echo.
            echo 二、安装 dws
            echo   npm install -g --allow-scripts=dingtalk-workspace-cli dingtalk-workspace-cli
            echo   或下载 dws.exe 放到 pms_sync.exe 同级目录
            echo.
            echo 三、运行（重要：不要在 C:\WINDOWS\system32 下运行！^)
            echo   先 cd 到 exe 所在目录，然后:
            echo   pms_sync.exe --token "Bearer TOKEN"         增量同步昨天
            echo   pms_sync.exe --token "Bearer TOKEN" --dry-run  仅检查
            echo   pms_sync.exe --token "Bearer TOKEN" --full   全量同步
            echo.
            echo 四、日志
            echo   每次运行后自动在程序所在目录创建 logs\ 文件夹
          ) > release_pms_sync\使用说明.txt
          (
            echo @echo off
            echo chcp 65001 ^>nul
            echo setlocal enabledelayedexpansion
            echo echo ============================================
            echo echo   PMS Sync Tool
            echo echo ============================================
            echo echo.
            echo echo Paste your PMS Bearer Token and press Enter:
            echo echo.
            echo set /p TOKEN="Token: "
            echo echo.
            echo echo Syncing, please wait...
            echo "%%~dp0pms_sync.exe" --token "!TOKEN!"
            echo echo.
            echo echo Done! Logs saved to: %%~dp0logs\
            echo echo.
            echo pause
          ) > release_pms_sync\一键运行.bat
          (
            echo @echo off
            echo chcp 65001 ^>nul
            echo echo ============================================
            echo echo   PMS Sync Tool - Dry Run ^(no write^)
            echo echo ============================================
            echo echo.
            echo set /p TOKEN="Token: "
            echo echo.
            echo "%%~dp0pms_sync.exe" --token "!TOKEN!" --dry-run
            echo echo.
            echo pause
          ) > release_pms_sync\一键检查.bat

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: pms_sync_windows
          path: release_pms_sync/
          retention-days: 30
