name: Build Windows EXE

# 触发条件：手动触发 + 推送 NewScripts 目录代码改动时自动打包
on:
  workflow_dispatch:          # 手动触发（GitHub 页面点 Run workflow）
  push:
    branches: [ main, master ]
    paths:
      - 'NewScripts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest    # 云端 Windows 环境
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi

      - name: 构建 exe（基于 NewScripts/）
        run: |
          cd NewScripts
          python -m PyInstaller pms_sync.spec --clean --noconfirm
          if (-not (Test-Path dist\pms_sync.exe)) { throw "Build failed: dist\pms_sync.exe not found" }
          New-Item -ItemType Directory -Force -Path ..\release_pms_sync | Out-Null
          Copy-Item dist\pms_sync.exe ..\release_pms_sync\
          Copy-Item build_exe.bat ..\release_pms_sync\
          @"
          PMS Sync Tool - User Guide
          ==========================

          1. Install dws CLI:
             npm install -g --allow-scripts=dingtalk-workspace-cli dingtalk-workspace-cli
             then: dws auth login

          2. Run:
             pms_sync.exe --token "Bearer YOUR_TOKEN"
             pms_sync.exe --token "Bearer YOUR_TOKEN" --dry-run
             pms_sync.exe --token "Bearer YOUR_TOKEN" --full

          3. Logs auto-saved to: pms_sync.exe\logs\
          "@ | Out-File -FilePath ..\release_pms_sync\README.txt -Encoding utf8

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: pms_sync_windows
          path: release_pms_sync/
          if-no-files-found: error

      # 打 tag (如 v1.0) 时额外创建 Release
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_pms_sync/pms_sync.exe
          generate_release_notes: true
