name: Build Windows EXE

# 触发条件：手动触发 + 推送 NewScripts 目录代码改动时自动打包
on:
  workflow_dispatch:          # 手动触发（GitHub 页面点 Run workflow）
  push:
    branches: [ main, master ]
    paths:
      - 'NewScripts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest    # 云端 Windows 环境
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi

      - name: 构建 pms_sync.exe
        run: |
          cd NewScripts
          pyinstaller --clean --noconfirm --onefile --console --name pms_sync --hidden-import certifi --hidden-import certifi.core --hidden-import ssl --hidden-import json --hidden-import argparse --hidden-import urllib --hidden-import urllib.request --hidden-import urllib.error --hidden-import urllib.parse --hidden-import subprocess --hidden-import datetime --hidden-import sys --hidden-import os --hidden-import logging --hidden-import logging.handlers --hidden-import traceback --hidden-import time --hidden-import io --collect-data certifi pms_sync.py
          if (-not (Test-Path dist\pms_sync.exe)) { throw "pms_sync.exe not built" }

      - name: 构建 panel.exe
        run: |
          cd NewScripts
          pyinstaller panel.spec --clean --noconfirm
          if (-not (Test-Path dist\pms_panel.exe)) { throw "panel.exe not built" }

      - name: 打包发布
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item NewScripts\dist\pms_sync.exe release\
          Copy-Item NewScripts\dist\pms_panel.exe release\
          Set-Content -Path release\使用说明.txt -Value @"
          PMS -> DingTalk AI 
          ============================

          TWO EXEs:
            pms_sync.exe   command-line sync tool
            pms_panel.exe  visual sync panel (double-click to open)

          PREP (first time):
            npm install -g --allow-scripts=dingtalk-workspace-cli dingtalk-workspace-cli
            dws auth login

          PANEL USAGE:
            Double-click pms_panel.exe, browser opens automatically
            - Enter token -> choose mode -> click Start
            - Supports: incremental / full / single date / date range / dry-run

          CLI USAGE:
            pms_sync.exe --token "Bearer TOKEN"                daily sync
            pms_sync.exe --token "Bearer TOKEN" --full          full sync
            pms_sync.exe --token "Bearer TOKEN" --date 2026-08-01
            pms_sync.exe --token "Bearer TOKEN" --days 7
            pms_sync.exe --token "Bearer TOKEN" --dry-run

          TABLE STRATEGY:
            material/warehouse: full sync + orphan delete (key: num/code)
            order/detail:      target date / full sync (key: orderId/detailId)
            inventory:         target date + skip, --full for update (key: recordNum)

          Logs: pms_sync.exe\logs\  or  pms_panel.exe\logs\
          "@ -Encoding utf8

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: pms_sync_windows
          path: release/
          if-no-files-found: error

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/pms_sync.exe, release/pms_panel.exe
          generate_release_notes: true
