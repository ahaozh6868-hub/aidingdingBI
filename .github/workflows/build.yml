name: Build Windows EXE

# 触发条件：手动触发 + 推送 NewScripts 目录代码改动时自动打包
on:
  workflow_dispatch:          # 手动触发（GitHub 页面点 Run workflow）
  push:
    branches: [ main, master ]
    paths:
      - 'NewScripts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest    # 云端 Windows 环境
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi

      - name: 构建 exe
        run: |
          cd NewScripts
          pyinstaller --clean --noconfirm --onefile --console --name pms_sync --hidden-import certifi --hidden-import certifi.core --hidden-import ssl --hidden-import json --hidden-import argparse --hidden-import urllib --hidden-import urllib.request --hidden-import urllib.error --hidden-import urllib.parse --hidden-import subprocess --hidden-import datetime --hidden-import sys --hidden-import os --hidden-import logging --hidden-import logging.handlers --hidden-import traceback --hidden-import time --hidden-import io --collect-data certifi pms_sync.py
          if (-not (Test-Path dist\pms_sync.exe)) { throw "EXE not built" }
          New-Item -ItemType Directory -Force -Path ..\release | Out-Null
          Copy-Item dist\pms_sync.exe ..\release\
          Set-Content -Path ..\release\使用说明.txt -Value @"
          PMS -> DingTalk AI Sync Tool
          ============================

          ENV PREP (first time only):
            npm install -g --allow-scripts=dingtalk-workspace-cli dingtalk-workspace-cli
            dws auth login

          USAGE:
            pms_sync.exe --token "Bearer TOKEN"                daily sync (last 3 days)
            pms_sync.exe --token "Bearer TOKEN" --full          full sync all tables
            pms_sync.exe --token "Bearer TOKEN" --date 2026-08-01   single date
            pms_sync.exe --token "Bearer TOKEN" --days 7             last 7 days
            pms_sync.exe --token "Bearer TOKEN" --dry-run            preview only
            pms_sync.exe --token "Bearer TOKEN" --dws-path "D:\path\dws.cmd"

          TABLE STRATEGY:
            material / warehouse : full sync + orphan deletion (key: num / code)
            order / detail       : target date / full sync (key: orderId / detailId)
            inventory            : target date + skip update, --full for full update (key: recordNum)

          PMS API: https://pms.cosmos-ag.com (baseId=152)
          AI Table: vNG4YZ7Jnlp30gY2HNoGqLr9W2LD0oRE

          Logs saved to: pms_sync.exe\logs\sync_YYYYMMDD_HHMMSS.log
          "@ -Encoding utf8

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: pms_sync_windows
          path: release/
          if-no-files-found: error

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/pms_sync.exe
          generate_release_notes: true
