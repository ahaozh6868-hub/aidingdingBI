name: Build Windows EXE

# 触发条件：手动触发 + 推送 NewScripts 目录代码改动时自动打包
on:
  workflow_dispatch:          # 手动触发（GitHub 页面点 Run workflow）
  push:
    branches: [ main, master ]
    paths:
      - 'NewScripts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest    # 云端 Windows 环境
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi

      - name: 构建 exe（基于 NewScripts/）
        run: |
          cd NewScripts
          pyinstaller pms_sync.spec --clean --noconfirm
          mkdir ..\release_pms_sync
          copy dist\pms_sync.exe ..\release_pms_sync\
          copy build_exe.bat ..\release_pms_sync\
          (
            echo PMS Sync Tool - User Guide
            echo ==========================
            echo.
            echo 1. Install dws CLI:
            echo    npm install -g --allow-scripts=dingtalk-workspace-cli dingtalk-workspace-cli
            echo    then: dws auth login
            echo.
            echo 2. Double-click "build_exe.bat" OR run:
            echo    pms_sync.exe --token "Bearer YOUR_TOKEN"
            echo    pms_sync.exe --token "Bearer YOUR_TOKEN" --dry-run
            echo    pms_sync.exe --token "Bearer YOUR_TOKEN" --full
            echo.
            echo 3. Logs auto-saved to: pms_sync.exe\logs\
          ) > ..\release_pms_sync\README.txt

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: pms_sync_windows
          path: release_pms_sync/
          if-no-files-found: error

      # 打 tag (如 v1.0) 时额外创建 Release
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_pms_sync/pms_sync.exe
          generate_release_notes: true
