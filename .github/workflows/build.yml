name: Build Windows EXE

# 触发条件：手动触发 + 推送 NewScripts 目录代码改动时自动打包
on:
  workflow_dispatch:          # 手动触发（GitHub 页面点 Run workflow）
  push:
    branches: [ main, master ]
    paths:
      - 'NewScripts/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest    # 云端 Windows 环境
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi

      - name: 构建 exe
        run: |
          cd NewScripts
          pyinstaller pms_sync.spec --clean --noconfirm
          dir dist\
          New-Item -ItemType Directory -Force -Path ..\release_pms_sync | Out-Null
          Copy-Item dist\pms_sync.exe ..\release_pms_sync\
          New-Item -ItemType File -Path ..\release_pms_sync\使用说明.txt -Force -Value @"
          PMS Sync Tool
          =============
          1. npm install -g --allow-scripts=dingtalk-workspace-cli dingtalk-workspace-cli
             dws auth login
          2. pms_sync.exe --token "Bearer TOKEN"
             pms_sync.exe --token "Bearer TOKEN" --dry-run
             pms_sync.exe --token "Bearer TOKEN" --full
          3. Logs: pms_sync.exe folder\logs\
          "@

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: pms_sync_windows
          path: release_pms_sync/
          if-no-files-found: error

      # 打 tag (如 v1.0) 时额外创建 Release
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release_pms_sync/pms_sync.exe
          generate_release_notes: true
